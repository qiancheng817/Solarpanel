plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solarpanel.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.solarpanel.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/solarpanel.jks')
            storePassword 'solarpanel'
            keyAlias 'solarpanel'
            keyPassword 'solarpanel'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 若仓库内没有密钥库（例如首次构建前），退化为 debug 签名以便仍然能产出可安装的包。
            // CI 会在构建前自动生成密钥库，因此正式产物始终使用 release 签名。
            if (rootProject.file('keystore/solarpanel.jks').exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
